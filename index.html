<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tisha — For You</title>
<style>
body{margin:0;background:#0b1020;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:#111423;padding:20px;border-radius:14px;max-width:600px;width:100%;text-align:center}
.btn{background:#ff4d6d;border:none;padding:12px 18px;color:#fff;font-size:18px;border-radius:10px;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;padding:20px}
.sheet{background:#111423;padding:20px;border-radius:14px;max-width:700px;width:100%;position:relative}
#flowerShow img{width:100%;border-radius:12px}
.petal{position:fixed;top:-40px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(120vh);opacity:0}}
</style>
</head>
<body>
<div class="card">
<h2>Tisha — For You</h2>
<p>Click below</p>
<button class="btn" id="openBtn">Tisha — For You</button>
</div>

<div id="overlay">
<div class="sheet">
<h2>Tisha, শুধু তোমার জন্য?</h2>
<p>Would you be mine? ❤️</p>
<button class="btn" id="yesBtn">এখানে ক্লিক করতে থাকেন</button>

<div id="flowerShow" style="display:none;margin-top:20px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));display:grid;gap:10px;">
<img src="https://https://drive.google.com/file/d/1_6BQbEMsTkTi9sTJl-kWruq6s8S8ruWB/view?usp=drivesdk">
</div>
</div>
</div>

<script>
openBtn.onclick=()=>{overlay.style.display='flex';}
yesBtn.onclick=()=>{flowerShow.style.display='grid';spawnMany();}

function spawnRose(){
 let r=document.createElement('div');
 r.textContent='🌹';
 r.className='petal';
 r.style.left=Math.random()*100+'%';
 r.style.animationDuration=(5+Math.random()*5)+'s';
 document.body.appendChild(r);
 setTimeout(()=>r.remove(),10000);
}
function spawnMany(){for(let i=0;i<20;i++)setTimeout(spawnRose,i*300);}
setInterval(spawnRose,1200);
</script>
</body>
</html>
